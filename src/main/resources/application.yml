# 공통 설정. 환경별 값은 환경변수로 넣는다(비밀값을 파일에 적지 않는다).
spring:
  application:
    name: liaison-back
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liaison}
    username: ${DB_USERNAME:liaison}
    password: ${DB_PASSWORD:liaison}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework # 개발·운영 서버에서는 Caddy(HTTPS) 뒤에서 동작
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    # SQL 바인딩 값(학생 이름 등)이 로그에 남지 않도록 org.hibernate.orm.jdbc.bind는 켜지 않는다.
---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.liaison: DEBUG
