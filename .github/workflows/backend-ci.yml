name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PR이 더한 마이그레이션의 버전이 main의 마지막 버전보다 뒤인지 확인한다(BACKEND.md 5장, out-of-order 끔).
      - name: Migration version order check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          dir=src/main/resources/db/migration
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          last=$(git ls-tree --name-only "origin/$BASE_REF" "$dir/" | sed -nE 's#.*/V([0-9]{14})__.*#\1#p' | sort | tail -n 1)
          if [ -z "$last" ]; then exit 0; fi
          bad=0
          for f in $(git diff --name-only --diff-filter=A "origin/$BASE_REF" HEAD -- "$dir"); do
            v=$(basename "$f" | sed -nE 's#^V([0-9]{14})__.*#\1#p')
            if [[ -n "$v" && ! "$v" > "$last" ]]; then
              echo "::error file=$f::버전 $v 이 main의 마지막 버전 $last 보다 뒤가 아닙니다. main을 받은 뒤 파일 이름의 시각을 date -u +%Y%m%d%H%M%S 로 바꾸세요."
              bad=1
            fi
          done
          exit $bad

      # gradle-wrapper.jar가 Gradle 공식 배포본과 같은지 확인한다.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # 상용 비공개 캐시(enhanced) 대신 공개 소스(MIT) 캐시를 쓴다. 외부 서비스·비공개 코드를 CI에 들이지 않기 위해서다.
          cache-provider: basic

      # spotlessCheck(형식) + 테스트(Testcontainers PostgreSQL 17) + bootJar
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Docker image build check
        run: docker build -t liaison-back:ci .
