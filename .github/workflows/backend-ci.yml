name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar가 Gradle 공식 배포본과 같은지 확인한다.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # 상용 비공개 캐시(enhanced) 대신 공개 소스(MIT) 캐시를 쓴다. 외부 서비스·비공개 코드를 CI에 들이지 않기 위해서다.
          cache-provider: basic

      # spotlessCheck(형식) + 테스트(Testcontainers PostgreSQL 17) + bootJar
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Docker image build check
        run: docker build -t liaison-back:ci .
