name: Dependency Submission

# GitHub 의존성 그래프는 build.gradle을 직접 읽지 못한다.
# main에 올라갈 때마다 실제로 쓰는 의존성 목록(전이 의존성 포함)을 제출해야 Dependabot 보안 경고가 생긴다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 의존성 그래프 제출에 필요

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
